[project]
name = "capx"
version = "0.1.0"
description = "CaP-X: Code-as-Policies eXtended with RL for V(L)A code-as-action with simulators (LIBERO/robosuite/BEHAVIOR)."
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
authors = [
  { name = "CaP-X Authors" }
]
keywords = ["reinforcement-learning", "LLM", "VLM", "robotics", "VeRL", "GRPO", "PPO"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

# Slim default install: exactly what the privileged RoboSuite tasks need (CPU only,
# no Torch / Ray / Open3D / perception models). Heavy packages live in the
# `perception` extra below.
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.26",
  "tyro>=0.8.5",
  "pydantic>=2.7",
  "rich>=13.7",
  "scipy>=1.12,<1.18",  # 1.18+ needs numpy>=2 (numpy is pinned to 1.26.4 below)
  "matplotlib>=3.10",
  "imageio[ffmpeg]>=0.6.0",
  "requests",
  "tqdm",
  "pyyaml",
  "omegaconf",
  "pyroki @ git+https://github.com/chungmin99/pyroki.git",
  "robot_descriptions>=1.16.0",
  "yourdfpy>=0.0.56",
  "viser>=0.2.0",
  "trimesh>=4.4.0",
  "msgpack_numpy",
  "uvicorn",
  "fastapi",
  "opencv-python-headless",
  "pillow>=10",
  "cloudpickle",
  "h5py",  # imported by robosuite.utils.camera_utils
  "mujoco>=3.3.0,<3.6",  # robosuite 1.5 asserts on newer joint-type enums (locked: 3.5.0)
  "robosuite",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff",
  "mypy>=1.10",
  "pillow>=10",
  "requests>=2.32",
]

perception = [
  "torch>=2.8",
  "torchvision>=0.23",
  "open3d",
  "transformers",
  "einops",
  "decord",
  "pycocotools",
  "ray==2.48.0",
  "pyrender",
  "mediapy>=1.2.5",
  "openai",
]
robosuite = []  # kept for compatibility: robosuite is now a default dependency
molmo = [
  "torch==2.9.1",
  "vllm==0.15.0 ; extra == 'molmo'",
  "tensorflow", 
  "accelerate"
]
ovdet = [
  "transformers>=4.41",
  "pillow>=10",
  "requests>=2.32",
]

# Only the RoboSuite submodule is a package source. This fork no longer packages the
# LIBERO, verl, sam3, contact_graspnet or cuRobo extras: their sources were
# uninitialised submodules, and uv reads every path source when locking, so `uv lock` /
# `uv sync` failed unless all of them were checked out. Install those by hand if needed.
[tool.uv.sources]
robosuite = { path = "capx/third_party/robosuite", editable = true }

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
override-dependencies = [
    "transformers<5.0",
    "PyOpenGL==3.1.6",
    "PyOpenGL-accelerate==3.1.6",
    "numpy==1.26.4",
    "opencv-python-headless<4.13",
    "opencv-python ; sys_platform == 'never'",
    "jax<0.4.30",
    "jaxlib<0.4.30",
    "ml-dtypes<0.6"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["capx*"]
exclude = ["tests*", "configs*"]

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake<3.27"]

[tool.uv.workspace]
exclude = [
    "capx/third_party/b1k",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["N803", "UP047", "N806", "F401", "E501"]
force-exclude = true
extend-exclude = [
  "capx/third_party/**",
  "third_party/**",
  "tests/**",
  "scripts/**",
  "outputs/**",
]

[tool.ruff.lint.per-file-ignores]
"capx/third_party/**" = ["ALL"]


[tool.setuptools.package-data]
"capx.envs" = [
  "assets/ur5_pick_place/*.xml",
  "assets/ur5_pick_place/ur5e/*.obj",
  "assets/ur5_pick_place/robotiq_2f85/*.stl",
]
